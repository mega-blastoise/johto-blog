name: Sanity check

on:
  push:
    # Branches only: version tags are verified by the release workflow.
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Workspace packages publish their types from dist/, so build first.
      - name: Build static site
        run: bun run build

      - name: Check types
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Verify deployable output
        run: test -f apps/web/dist/index.html

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: prize-map-static-site
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1
