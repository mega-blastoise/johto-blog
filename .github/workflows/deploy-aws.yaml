name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      invalidate_cache:
        description: Invalidate the CloudFront cache after deployment
        required: true
        default: true
        type: boolean

concurrency:
  group: prize-map-production-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  verify-and-build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build static site
        run: bun run build

      - name: Verify deployable output
        run: test -f dist/index.html

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: prize-map-static-site
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy production
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download static artifact
        uses: actions/download-artifact@v4
        with:
          name: prize-map-static-site
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: prize-map-release-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          unset-current-credentials: true

      - name: Sync static site to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          set -euo pipefail

          # Source maps are useful locally, but are not part of the public release.
          aws s3 rm "s3://${S3_BUCKET}" --recursive --exclude "*" --include "*.map" --only-show-errors

          # HTML and fixed-name entry files must always revalidate.
          aws s3 sync dist "s3://${S3_BUCKET}" \
            --delete \
            --exclude "*.map" \
            --cache-control "max-age=0, no-cache, no-store, must-revalidate" \
            --only-show-errors

          # Bun emits content-hashed route chunks, which can be cached indefinitely.
          if [[ -d dist/chunks ]]; then
            aws s3 cp dist/chunks "s3://${S3_BUCKET}/chunks" \
              --recursive \
              --exclude "*.map" \
              --cache-control "public, max-age=31536000, immutable" \
              --only-show-errors
          fi

      - name: Invalidate CloudFront
        if: ${{ github.event_name == 'push' || inputs.invalidate_cache }}
        id: invalidate
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)"
          echo "id=${invalidation_id}" >> "$GITHUB_OUTPUT"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${invalidation_id}"

      - name: Validate public site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --silent --show-error \
            --output /dev/null \
            "${SITE_URL}/"

      - name: Write deployment summary
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          {
            echo "## Prize Map production release"
            echo
            echo "- Site: ${SITE_URL}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- CloudFront invalidation: ${{ steps.invalidate.outputs.id || 'skipped' }}"
          } >> "$GITHUB_STEP_SUMMARY"
