name: Deploy to AWS

on:
  push:
    tags:
      - "v*"
  # Redeploy by running the workflow from an existing v* tag; the production
  # environment only accepts tag refs.
  workflow_dispatch:

concurrency:
  group: prize-map-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/sanity-check.yaml

  deploy:
    name: Deploy production
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download static artifact
        uses: actions/download-artifact@v4
        with:
          name: prize-map-static-site
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: prize-map-release-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          unset-current-credentials: true

      # Bun content-hashes every emitted file except the HTML documents and the
      # fixed-name entry files, so everything else can be cached forever. If a
      # fixed-name public file (favicon, robots.txt) is added later, list it in
      # both upload steps below.
      - name: Upload hashed assets
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws s3 sync dist "s3://${S3_BUCKET}" \
            --exclude "*.map" \
            --exclude "*.html" \
            --exclude "app.js" \
            --exclude "app.css" \
            --cache-control "public, max-age=31536000, immutable" \
            --only-show-errors

      # Browsers revalidate these on every load; CloudFront keeps them until the
      # invalidation below.
      - name: Upload documents and entry files
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws s3 sync dist "s3://${S3_BUCKET}" \
            --exclude "*" \
            --include "*.html" \
            --include "app.js" \
            --include "app.css" \
            --cache-control "public, max-age=0, s-maxage=31536000, must-revalidate" \
            --only-show-errors

      - name: Invalidate CloudFront
        id: invalidate
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)"
          echo "id=${invalidation_id}" >> "$GITHUB_OUTPUT"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${invalidation_id}"

      # Stale chunks are removed only once the new documents are live, so a page
      # loaded mid-release can still fetch the chunks it references. Every
      # current file was uploaded above, so --size-only limits this to deletes.
      - name: Remove stale objects
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws s3 sync dist "s3://${S3_BUCKET}" \
            --delete \
            --size-only \
            --exclude "*.map" \
            --only-show-errors

      - name: Validate public site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          for route in / /posts/ /about/; do
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
              --silent --show-error --output /dev/null \
              "${SITE_URL%/}${route}"
            echo "OK ${route}"
          done

      - name: Write deployment summary
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INVALIDATION_ID: ${{ steps.invalidate.outputs.id }}
        run: |
          {
            echo "## Prize Map ${GITHUB_REF_NAME}"
            echo
            echo "- Site: ${SITE_URL}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- CloudFront invalidation: ${INVALIDATION_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub Release
    needs: deploy
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            gh release create "${TAG}" --verify-tag --generate-notes --title "${TAG}"
          fi
